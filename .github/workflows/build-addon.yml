name: Build NVDA add-on

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build add-on
        run: python build.py

      - name: Upload NVDA add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioProcessor-NVDA-addon
          path: dist/*.nvda-addon
          if-no-files-found: error
