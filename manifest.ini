name = audioEQ
summary = "Audio Processor"
description = """Real-time multi-effect audio processor for NVDA with resonant High Pass and Low Pass, four-band Parametric EQ, Master Gain, 1176 Compressor, a shared Free/Trigger LFO for Pan/Low Pass/High Pass, Stereo Chorus, Stereo Delay, Stereo Reverb with seven selectable types (Classic, Room, Chamber, Hall, Cathedral, Plate, Spring), and Limiter. Chorus remains a parallel send while Delay and Reverb form an orderable serial send chain; dry stays at full level and all wet returns are summed sample-accurately into the same WavePlayer master buffer. There is no independent wet player, preventing old effect audio from bleeding under later speech. Includes optional preset-aware NVDA Audio Device Lock, independently switchable Delay/Reverb post-source gate-hold tails (Off by default), 32 Factory presets, user presets, Custom Actions API integration and documentation in English, Italian, Spanish and French. The first time effect feeds the second; the Delay before Reverb checkbox selects Delay -> Reverb when enabled and Reverb -> Delay when disabled. Chain Blend 0-100 controls how much of that first wet return also remains directly audible: 0 preserves the previous mix, while 100 hears the first effect only through the second. Current limitation: this release is intended for 64-bit NVDA and audio paths that use nvwave/WavePlayer."""
author = "Lo-lo"
url = None
version = 1.0.62
changelog = """1.0.62 TEST62: adds a Reverb Type selector (Classic, Room, Chamber, Hall, Cathedral, Plate, Spring) using seven distinct low-CPU stereo reverb networks. Classic is sample-for-sample compatible with TEST61 and is the default for all existing settings and presets. New mode selection is live and saved with user presets and Custom Actions. Reverb Size/Decay/Damping/Send and all current Delay/Reverb routing, memory, tail and focus logic are preserved. Adds next/previous Reverb Type commands to Input Gestures and updates four-language documentation and translations. 1.0.61 TEST61: fixes startup compatibility for the speech WavePlayer that NVDA may create before global plugins are loaded. If that already-existing player has not passed through Audio Processor patched initialization, the speech feed lock and related FIFO bookkeeping are now initialized lazily on the first speech buffer. This avoids the startup-only failure where processing begins only after changing synthesizer once. No DSP, preset, routing, Delay/Reverb, Chain Blend or normal newly-created WavePlayer behavior is changed. 1.0.60 TEST60: adds Chain Blend 0-100 on top of the repaired TEST59 release-candidate baseline. The 20 ms speech FIFO mixer, integrated Delay/Reverb tails, IBM ECI <=350 ms short-tail compatibility, Device Lock, runtime modules and scheduling are unchanged. Chain Blend affects only the orderable Delay/Reverb serial return when both effects are active: 0 preserves TEST59 exactly; increasing the value progressively reduces the direct audible return of the first effect while keeping that first return at full level inside the input of the second effect. At 100 the first effect is heard only through the second effect, producing a more integrated Delay -> Reverb or Reverb -> Delay chain. The same rule is applied to gate-hold tails. If only one of Delay/Reverb is active, Chain Blend has no level effect. Existing presets default to 0 and therefore retain their previous sound. 1.0.59 TEST59 corrected release candidate: repairs a regression introduced while removing TEST52-55 benchmark telemetry. TEST56 accidentally removed four functional speech FIFO routines together with the diagnostic block: fixed-block DSP rendering, tail-request detection, tail-plan creation and wet-tail rendering. TEST59 restores those routines exactly from the validated TEST55 baseline while keeping NVDA+Alt+B and the continuous rolling benchmark telemetry removed. Mixer, 20 ms FIFO behavior, integrated Delay/Reverb tails, IBM ECI <=350 ms short-tail compatibility, DSP, presets and Device Lock otherwise remain unchanged.  closes the TEST42-55 optimization/refactoring/mixer phase without changing the validated audio behavior of TEST55. The NVDA+Alt+B pre-mixer benchmark command and all continuous rolling benchmark telemetry have been removed from the release audio path. The dedicated approximately 20 ms speech FIFO mixer, integrated same-WavePlayer Delay/Reverb tails, IBM ECI short-utterance compatibility (tails suppressed only for IBM utterances up to 350 ms PCM), optimized DSP, preset-aware Audio Device Lock, storage/device/runtime modularization and existing tail timing diagnostic remain unchanged. Mixer callbacks now retain only functional boundary-completion cleanup and error logging; diagnostic chunk/enqueue/tail event reporting is discarded. Documentation has been updated to describe the current FIFO stop/new-speech semantics and the IBM compatibility rule. This build is intended as the final regression/release-candidate build before publication. 1.0.55 TEST55: IBM ECI/IBM TTS short-utterance compatibility on top of TEST54. The 20 ms FIFO mixer, DSP, integrated Delay/Reverb tails and all non-IBM synth behavior are unchanged. For the ibmeci synthesizer only, the FIFO now measures source PCM accumulated since the previous speech idle. When Delay/Reverb Tail would otherwise be active and the IBM utterance contains more than 0 but no more than 350 ms of source PCM, only the post-speech tail is suppressed; Delay/Reverb remain fully active while the letter/short utterance itself is rendered. IBM utterances longer than 350 ms retain the normal TEST54 integrated tail. This targets the observed IBM behavior where rapidly typed letters or very short navigation speech could have their dry PCM flushed by the following async tail, leaving mainly the wet tail audible. NVDA+Alt+B records mixerTailSuppressedIBMShort with the measured utterance duration and threshold. Explicit stop/reset semantics are unchanged. 1.0.54 TEST54: integrates speech Delay/Reverb tails directly into the TEST53 20 ms FIFO master stream. When a tail-enabled speech idle reaches the FIFO worker, the worker continues the exact live StreamProcessor Delay/Reverb memories with digital-silent input and feeds the wet-only blocks to the same original WavePlayer before the native idle boundary; no second player, completion-callback bridge or per-tail thread is used for the FIFO speech path. Tail-enabled speech idle returns asynchronously, matching the established Gate Hold behaviour, while tail-disabled idle retains TEST53 synchronous barrier semantics. If new source PCM arrives while wet-only blocks are already queued, the mixer immediately calls the original WavePlayer.stop to flush only that native wet backlog, preserves the Delay/Reverb DSP state, cancels further tail rendering and lets the new source enter the same effect memories rather than waiting behind stale reverb. An explicit speech stop remains a hard interruption that invalidates both FIFO source and integrated tail work, flushes native playback and clears the processor state. Tail decay/quiet detection and hard safety limits reuse the existing TEST51/1.0.40 Gate Hold rules, but tail block size now follows the same approximately 20 ms mixer clock. NVDA+Alt+B adds mixerTailStart/mixerTailChunk/mixerTailFlushForSource/mixerTailInterrupted/boundary events. Sounds continue to use the TEST51 Gate Hold implementation. DSP equations, presets, Device Lock and routing are otherwise unchanged. 1.0.53 TEST53: first dedicated speech FIFO mixer experiment, based on TEST52/TEST51. Selected Speech PCM is copied at WavePlayer.feed entry and queued to one persistent per-WavePlayer worker; the source feed returns without waiting for native buffer space. The worker splits each source buffer into source-frame-aligned blocks of approximately 20 ms before StreamProcessor DSP, then feeds those blocks in order to the same original WavePlayer. An original source onDone callback is attached only to the final native subblock derived from that source feed. Speech idle is now an in-order FIFO barrier: after all preceding blocks have been submitted, the worker calls the original synchronous WavePlayer.idle/sync and releases the waiting synth thread. Speech stop invalidates the FIFO epoch, drops pending source blocks and calls the original stop immediately; stale worker blocks are rejected after interruption. Delay/Reverb post-speech tails are intentionally disabled on the TEST53 speech FIFO path so ordinary speech, callback, idle and stop semantics can be validated before tails are added to the continuous mixer stream. Sounds retain the TEST51 direct/tail path. The NVDA+Alt+B diagnostic remains and now records mixer enqueue/chunk/barrier events. DSP equations, presets, Device Lock and routing are otherwise unchanged. 1.0.52 TEST52: diagnostic-only continuation of TEST51, preparing the dedicated FIFO/mixer design. audioRuntime.py now keeps a bounded rolling pre-mixer timing trace of processed source feeds without changing chunk sizes, DSP equations, WavePlayer scheduling, tail constants or requesting any additional native callbacks. The trace records current synthesizer, stream purpose/format, source PCM bytes and duration, interval between source feed arrivals, previous-chunk timing slack, time spent specifically in StreamProcessor.process_split(), time spent in the existing native WavePlayer.feed call, a wall-clock estimate of PCM still queued before/after each source feed, pre_synthSpeak boundaries, idle, stop and onDone events that TEST51 already requested. NVDA+Alt+B copies a report containing aggregates, p95/max timings, format totals and the latest detailed events. The queue value is explicitly diagnostic/modelled rather than a direct WASAPI queue query. Audio DSP, Device Lock, presets, routing, Delay/Reverb tails and all TEST51 runtime behavior are intentionally unchanged. 1.0.51 TEST51: structural refactoring only, based on TEST50. The complete nvwave/WavePlayer interception runtime has been moved out of globalPlugins/audioEQ/__init__.py into a dedicated audioRuntime.py module: WavePlayer init/feed/idle/stop monkey patches, same-player Delay/Reverb Gate Hold tails, speech PCM completion bridge/dispatcher, tail timing diagnostic, stream processing counters/status, shared LFO Trigger speech/input hooks and their install/uninstall lifecycle now live together behind one explicit runtime boundary. __init__.py continues to own settings, presets, UI, Custom Actions and startup routing decisions and provides the runtime only a settings-snapshot callback, avoiding circular imports. Device routing policy remains in deviceRouting.py and DSP equations remain in dsp.py. No DSP equations, tail scheduling constants, WavePlayer callback order, routing, presets or UI behavior are intentionally changed. 1.0.50 TEST50: structural refactoring only, based on TEST49. Active WASAPI/MMDevice enumeration and its short cache, persisted locked-device availability checks, routing-state comparison, current-synth recreation and NVDA tones reinitialization have been moved out of globalPlugins/audioEQ/__init__.py into a dedicated deviceRouting.py module. Small compatibility wrappers preserve the existing internal call interface, while the WavePlayer hook itself continues to enforce the selected locked endpoint exactly where it did in TEST49. Functional routing tests cover endpoint enumeration/deduplication/cache, unlocked and locked available/unavailable states, routing-key changes, device-name-only changes and the synth/tones refresh order. DSP, storage.py, preset data, GUI controls, tail scheduling and audio equations are unchanged from TEST49. No audio, preset, Device Lock semantics or UI behavior is intentionally changed. 1.0.49 TEST49: structural refactoring only, based on TEST48. All preset-folder handling, legacy preset migration, Factory/User preset JSON loading, User preset save/rename/delete, configuration-path handling and configuration JSON load/save have been moved out of globalPlugins/audioEQ/__init__.py into a dedicated storage.py module. The existing __init__.py runtime settings dictionary, settings lock/generation, GUI call sites, audio hooks, DSP, Delay/Reverb tails, Audio Device Lock and Custom Actions behavior remain in place; small compatibility wrappers preserve the same internal function interface while the implementation is separated. Functional storage tests cover configuration round-trip, preset create/overwrite/rename/delete, filename collisions, legacy-folder migration and all 32 Factory presets. dsp.py, Factory preset data, documentation and localization files are unchanged from TEST48. No audio, DSP, routing, tail scheduling, preset format or UI behavior is intentionally changed. 1.0.48 TEST48: optimization-only continuation of TEST47. Master Gain, static/dynamic Pan, the shared Pan/Filter LFO and the master Limiter keep the exact same gain laws, waveform generation, S&H sequence, smoothing, phase advancement, limiter ceiling/release and sample arithmetic. Chunk-invariant Master/Pan/Limiter values are now cached locally; the shared LFO advances with the same equations in the chunk hot path instead of calling _next_lfo_value() for every frame; Pan-LFO table lookup is inlined; common stereo mapping and mono/stereo limiter peak/output paths avoid tiny Python loops. Regression tests compare TEST47 and TEST48 across 2004 configurations including 8/16/24/32-bit PCM, multiple sample rates, mono/stereo streams, all LFO waveforms, smoothing, positive/negative Pan depth, Filter LFO, limiter release, full Chorus/Delay/Reverb/Compressor chains and Gate Hold tails, requiring byte-identical PCM and matching persistent states. No presets, UI, routing, tail scheduling or Audio Device Lock behavior are intentionally changed. 1.0.47 TEST47: optimization-only continuation of TEST46. High Pass, all four Parametric EQ bands and Low Pass keep the exact same biquad coefficients, Direct Form I arithmetic, per-channel state updates, stage order and control-rate filter-LFO coefficient changes. Mono and stereo source filtering now execute the same biquad equations directly in StreamProcessor.process_split() instead of calling BiquadStage.process() for every active filter stage and every source sample; multichannel input uses the same inlined arithmetic in its generic path. Regression tests compare TEST46 and TEST47 across mono/stereo, 8/16/24/32-bit PCM, multiple sample rates, 0-6 active stages, resonant HP/LP, four non-zero EQ bands and filter-LFO modulation, requiring byte-identical PCM and matching biquad states. No presets, UI, routing, tails, compressor, time effects or Audio Device Lock behavior are intentionally changed. 1.0.46 TEST46: optimization-only continuation of TEST45. The 1176-style compressor keeps the exact same fixed threshold, Input drive, Ratio modes, Attack/Release envelope, +6 dB internal makeup and Output trim. Its chunk-invariant gains, ratio exponent, threshold and envelope coefficients are now cached once per PCM chunk, mono and stereo linked-peak paths are specialized directly, and the same envelope arithmetic is executed inline instead of calling FETCompressor1176.process_frame() and repeatedly resolving object attributes for every source frame. Regression tests compare TEST45 and TEST46 across mono/stereo input, 8/16/24/32-bit PCM, multiple sample rates and compressor Input/Output/Ratio/Attack/Release settings, including surrounding Chorus/Delay/Reverb processing, with byte-identical PCM and compressor envelope state. No presets, UI, routing, tails or Audio Device Lock behavior are intentionally changed. 1.0.45 TEST45: optimization-only continuation of TEST44. Stereo Delay keeps the exact same delay time, feedback, Ping Pong injection/cross-feedback, send level, serial Delay/Reverb routing and Gate Hold tail state. The live and tail renderers now keep the Delay buffers, write index and fixed coefficients in chunk-local variables and execute the same per-frame arithmetic inline instead of calling StereoDelay.process_wet() and repeatedly resolving object attributes for every stereo frame. Regression tests across 8/16/24/32-bit PCM, 16/22.05/44.1/48 kHz, Ping Pong values, feedback/time settings, both Delay/Reverb orders and tail rendering produced byte-identical PCM compared with TEST44. No presets, UI, tail scheduling, audio-device behavior or DSP equations are intentionally changed. 1.0.44 TEST44: optimization-only continuation of TEST43. The Stereo Chorus keeps the exact same Juno-inspired modes I, II and I+II, fractional-delay interpolation, modulation phases, BBD-style wet low-pass, width processing, send routing and arithmetic order. The per-frame hot path now executes the fractional-delay reads and wet low-pass directly instead of repeatedly calling _tap(), _read() and _soften_wet(). Randomized regression tests across all three Chorus modes, multiple Depth/Rate/Width values, 16/22.05/44.1/48 kHz sample rates, surrounding Delay/Reverb/Compressor processing and Gate Hold rendering produced byte-identical PCM compared with TEST43. No presets, UI, tail scheduling, routing or Audio Device Lock behavior are intentionally changed. 1.0.43 TEST43: optimization-only continuation of TEST42. The Stereo Reverb keeps the exact same Schroeder network, comb/all-pass buffer lengths, feedback, damping, cross-feed, routing and arithmetic order, but its six comb filters and two all-pass stages are executed inline instead of through eight tiny Python method calls for every stereo frame. Randomized regression tests covering Reverb alone, both Delay/Reverb serial orders, the full effect chain and Gate Hold tail rendering produced byte-identical PCM compared with TEST42. No presets, UI, tail scheduling or audio-device behavior are intentionally changed. 1.0.42 TEST42: optimization-only build based exactly on 1.0.40. No DSP equations, effect routing, Delay/Reverb tail scheduling, presets, Audio Device Lock behavior or UI controls are intentionally changed. The hot settings snapshot path now uses shallow copies instead of copy.deepcopy because the settings schema contains only immutable primitive values; existing locking and detached-snapshot semantics are preserved. Mono-to-stereo neutral promotion now uses C-level bytearray extended-slice interleaving instead of a Python per-sample loop, preserving the exact PCM bytes for 8/16/24/32-bit input while substantially reducing CPU work. 1.0.40 TEST40: diagnostic-only build based on TEST39. No DSP, tail scheduling, queue depth, serial Delay/Reverb order, presets or UI behavior is changed. Adds an internal high-resolution timeline for the most recent speech utterance, recording pre_synthSpeak, each speech feed sequence and PCM duration, native playback callback/onDone, WavePlayer.idle, WavePlayer.stop, tail cancellation, bridge dispatch/start, and the first same-player tail feed. NVDA+Alt+R snapshots the timing before its own confirmation speech and copies the full report to the clipboard. This is intended to identify whether the intermittent short-utterance Reverb gap is caused by late idle, late playback completion, dispatcher scheduling, or tail-feed blocking instead of continuing to tune guessed millisecond constants. 1.0.39 TEST39: gives new real speech PCM absolute priority over already-queued speech-tail audio. TEST38 cancelled the tail worker but left its 5-10 ms rolling wet window in WASAPI, so a newly typed character or short word could be queued behind residual Reverb and then be cancelled by the next NVDA utterance before its dry PCM was ever heard. TEST39 flushes queued tail PCM with the original WavePlayer.stop whenever new real speech arrives, while preserving the exact Delay/Reverb DSP memories; the new source therefore starts immediately and continues through the same effect state. No second player is used; DSP, serial order, presets and UI are unchanged. 1.0.38 TEST38: wakes the active speech-tail completion Condition immediately when a tail is cancelled. In TEST37 the single persistent dispatcher could remain blocked for up to the 10 ms _doneCond wait timeout after new short speech arrived, so the next tail request sometimes started about 10 ms late depending on the exact phase of the previous tail. Cancellation now sets cancelEvent and notifies the waiting Condition at once, allowing the dispatcher to leave the previous tail immediately and service the newest utterance. DSP, Delay/Reverb memories, serial order, queue depth and UI are unchanged. 1.0.37 TEST37: removes per-utterance SpeechPcmBridgeTail thread creation. The single persistent AudioProcessorSpeechTailDispatcher now directly owns each rolling speech tail until it decays or a new real speech feed cancels it, with a 10 ms cancellation poll instead of 50 ms. Native source PCM feeds are also serialized with tail feed/stop/idle I/O through the same per-player lock, preventing rapid short utterances from entering WavePlayer.feed concurrently with a cancelling tail. DSP, serial Delay/Reverb order, presets and UI are unchanged. This test primarily targets the crashes seen while typing, correcting words and using short NVDA status/read-current-item messages; the remaining speech-to-tail gap is intentionally not hidden with re-entrant callback I/O. 1.0.36 TEST36: keeps the TEST35 10 ms speech-tail prime but moves all WavePlayer.feed calls out of nvwave's native playback-completion callback. A persistent AudioProcessorSpeechTailDispatcher daemon is started with the add-on; the onDone callback now only publishes the latest bridge request and returns immediately. The already-running dispatcher validates the latest speech sequence, primes the same two 5 ms wet blocks on the same WavePlayer, and then starts the normal rolling tail worker. Only the newest pending bridge request is retained, and the speech-feed lock is released before native feed calls, preventing rapid navigation from building stale jobs or forcing new source PCM to wait behind a blocking feed. This targets the TEST35 long-run NVDA stall while preserving its improved speech-to-Reverb continuity. No DSP, serial Delay/Reverb order, presets or UI controls are changed. 1.0.35 TEST35: keeps the TEST34 DSP and serial Delay/Reverb order unchanged, but primes the speech PCM bridge synchronously. When the final real speech block completes, the same WavePlayer now receives the initial two 5 ms wet Gate Hold blocks before the bridge worker thread is started, giving roughly 10 ms of queued continuation and reducing scheduler-sized gaps at the speech-to-Reverb-tail boundary. No second player is used. 1.0.34 TEST34: based directly on TEST30. Delay and Reverb are no longer independent parallel sends: they now form a serial send-style chain so the first effect feeds the second while the dry signal remains at full level. New Delay before Reverb checkbox: Off = Reverb -> Delay, On = Delay -> Reverb. Gate Hold tails follow the same selected order. Chorus remains an independent parallel send. 1.0.30 TEST30: makes repeated dialog Alt accelerators follow the real UI order through one generic cycling mechanism. Alt+P now cycles Preset -> Process -> Pan -> Preset, starting at Preset when focus is elsewhere. Alt+C now cycles 1176 Compressor -> Stereo Chorus -> 1176 Compressor, starting at Compressor when focus is elsewhere and treating every control inside each section as belonging to that section. Audio/DSP/tail behavior is otherwise identical to TEST23. 1.0.23 TEST23: removes the NVDA-utterance trigger/reset from Chorus/Delay/Reverb. When Delay/Reverb tails are enabled, a new spoken word or phrase now enters the same still-decaying time-effect memory instead of rebuilding it. pre_synthSpeak no longer stops Gate Hold or calls reset_send_memory; the existing tail is allowed to continue until real PCM arrives. At that exact feed boundary the tail feeder is cancelled while preserving Delay/Reverb state, so the new speech continues the same acoustic space. The shared LFO Trigger remains unchanged and still follows its explicit keyboard/focus semantics. There is no second speech wet WavePlayer in this test; it returns to TEST21/TEST15 same-player processing and keeps the PCM-completion bridge for synths that delay idle. 1.0.21 TEST21: starts speech Gate Hold from the native playback-completion callback of the newest real PCM block instead of waiting only for a synthesizer's logical idle call. This targets speech drivers that delay idle after PCM has already finished, which could produce an audible hole before an otherwise natural TEST15 Delay/Reverb tail. The speech bridge uses the same WavePlayer and the same existing Delay/Reverb state, with a rolling window of only two 5 ms wet blocks so a later speech chunk cannot sit behind a long pre-rendered tail. New speech cancels this bridge without stopping the player, while Sounds deliberately keep the exact TEST15 idle-start tail path. 1.0.15 TEST15: adds a new experimental same-player Gate Hold tail system for Stereo Delay and Stereo Reverb. Delay tail and Reverb tail are independent check boxes and are Off by default. At natural idle the existing Delay/Reverb DSP memories are kept alive by continuously feeding digital-silent PCM through the same WavePlayer; no second wet player is created and no effect state is reconstructed. Tail duration adapts to Delay Time/Feedback and Reverb Decay/Size, with actual quiet-level detection and a 12-second safety cap. Ctrl/speech cancellation still cuts the dry source immediately, then the selected wet memories may decay; a new utterance cancels any old tail before its first real buffer so stale reverb cannot sit under later speech. The first 10 ms hold block is primed synchronously and the remainder is fed from one daemon worker so NVDA is not blocked while the tail plays. Tail settings are included in presets and Custom Actions snapshots. Also completes localization of the Audio Device Lock controls/messages. 1.0.14 TEST14: adds optional NVDA Audio Device Lock. Lock is Off by default. When enabled, the selected active WASAPI/MMDevice endpoint is stored as part of the complete processor/preset state and forced for every nvwave/WavePlayer, so changing NVDA's own output-device setting cannot move audio while the lock remains active. The device combo is enabled only with the lock. Presets whose locked endpoint is unavailable are not applied: the previous complete processor/routing state stays active while the Preset selector remains on the unavailable entry, allowing navigation to continue to the next/previous preset. Locked endpoint availability is monitored with a short cache and new audio is suppressed if the exact endpoint disappears, avoiding silent fallback to the Windows default device. Routing changes recreate the current synth and tones player using the same refresh pattern as NVDA's Audio settings. 1.0.13 TEST13: Alt+P now cycles focus between Pan and the Preset combo, matching the existing Alt+C section cycle. The 1176 compressor now applies a fixed +6 dB internal makeup gain whenever enabled; the existing 1176 Output parameter remains an additional output trim, so all compressor-based Factory and User presets recover perceived level automatically without per-preset edits. 1.0.12 TEST12: expands LFO Trigger to manual keyboard input plus real control changes. Every non-modifier keyboard gesture (including arrows in text, Navigator Object commands, NVDA+Tab, typing and ordinary pass-through keys) arms exactly one shared LFO restart for the next speech caused by that action. gainFocus still triggers for automatic system/NVDA focus changes, and independent becomeNavigatorObject changes trigger as well. Say All restarts once when its keyboard command is pressed, then continues without retriggering on automatically generated speech unless a real control/object change occurs. 1.0.11 TEST11: changes LFO Trigger from every speech utterance to every newly focused NVDA control/object. A gainFocus event (for example a different file/list item, button, edit field or check box) arms the shared LFO restart, which is consumed immediately before speech for that control; unrelated speech messages no longer retrigger it. The reset also clears saved LFO continuity memory so phase 0 is reliable even after WavePlayer idle/stop. 1.0.10 TEST10: adds LFO Mode with Free and Trigger. Free preserves the existing continuous LFO phase across speech messages. Trigger restarts the shared Pan/Low Pass/High Pass LFO from phase zero immediately before each new NVDA speech utterance; smoothing and S&H state restart as well, without any end-of-audio callback. 1.0.9 TEST9: adds independent 0-100 Resonance controls to Low Pass and High Pass. The existing modulation LFO is now shared by Pan, Low Pass and High Pass, with independent signed -100..+100 Depth controls; negative filter Depth reverses LFO phase and full scale spans four octaves. Resonance 0 preserves the previous filter response and all older presets remain compatible. 1.0.8 TEST8 added signed Pan LFO Depth. 1.0.7 TEST7: keeps Chorus, Delay and Reverb as parallel sends but removes the independent wet WavePlayer. Wet returns are now summed sample-accurately into the same master buffer as the 100% dry signal, eliminating stale reverb/delay audio that could bleed underneath later speech during rapid navigation. The master limiter now sees the complete dry-plus-sends sum. Keeps the 0 dB-centre pan law and no post-speech tails. 1.0.6 TEST6 removed post-speech tail generation. 1.0.5 TEST5 introduced Chorus Send and the 0 dB-centre pan law. 1.0.3 TEST3 introduced parallel Delay/Reverb sends. 1.0.1 added the public Custom Actions integration API."""
