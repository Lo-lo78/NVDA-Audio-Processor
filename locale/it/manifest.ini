summary = "Processore audio"
description = """Processore audio multieffetto in tempo reale per NVDA con High Pass e Low Pass risonanti, 4-band Parametric EQ, Master Gain, 1176 Compressor, LFO condiviso Free/Trigger per Pan/Low Pass/High Pass, Stereo Chorus, Stereo Delay, Stereo Reverb con sette tipi selezionabili (Classic, Room, Chamber, Hall, Cathedral, Plate, Spring) e Limiter. Chorus resta un send parallelo. Delay e Reverb formano ora una catena seriale ordinabile: il dry resta a livello pieno, il primo effetto resta udibile e alimenta anche il secondo. Il checkbox Delay before Reverb seleziona Delay -> Reverb quando attivo e Reverb -> Delay quando disattivo. Chain Blend 0-100 riduce progressivamente il ritorno diretto del primo effetto lasciandolo però a pieno livello nell’ingresso del secondo; a 100 il primo effetto si ascolta solo attraverso il secondo. Non esiste più un player wet indipendente, evitando che il riverbero o il delay di una frase precedente riaffiorino sotto il parlato successivo. Include NVDA Audio Device Lock opzionale, code Delay/Reverb Gate Hold indipendenti e disattivate di default, 32 preset Factory, preset utente, integrazione API Custom Actions e documentazione in inglese, italiano, spagnolo e francese. Limitazione attuale: questa versione è destinata a NVDA a 64 bit e ai percorsi audio che usano nvwave/WavePlayer."""
