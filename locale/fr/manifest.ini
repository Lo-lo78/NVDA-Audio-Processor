summary = "Processeur audio"
description = """Processeur audio multieffet en temps réel pour NVDA avec High Pass et Low Pass résonants, 4-band Parametric EQ, Master Gain, 1176 Compressor, LFO partagé Free/Trigger pour Pan/Low Pass/High Pass, Stereo Chorus, Stereo Delay, Stereo Reverb et Limiter. Chorus reste un send parallèle. Delay et Reverb forment désormais une chaîne série dont l’ordre est sélectionnable : le dry reste à plein niveau, le premier effet reste audible et alimente aussi le second. La case Delay before Reverb sélectionne Delay -> Reverb lorsqu’elle est cochée et Reverb -> Delay lorsqu’elle est décochée. Chain Blend 0-100 réduit progressivement le retour direct du premier effet tout en le conservant à plein niveau dans l’entrée du second ; à 100 le premier effet est entendu uniquement à travers le second. Il n’existe plus de player wet indépendant, ce qui évite qu’un ancien Reverb ou Delay réapparaisse sous la parole suivante. Inclut NVDA Audio Device Lock optionnel, des queues Delay/Reverb Gate Hold indépendantes et désactivées par défaut, 32 presets Factory, les presets utilisateur, l’intégration API Custom Actions et la documentation en anglais, italien, espagnol et français. Limitation actuelle : cette version est destinée à NVDA 64 bits et aux chemins audio utilisant nvwave/WavePlayer."""
