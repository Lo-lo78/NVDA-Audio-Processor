summary = "Procesador de audio"
description = """Procesador de audio multiefecto en tiempo real para NVDA con High Pass y Low Pass resonantes, 4-band Parametric EQ, Master Gain, 1176 Compressor, LFO compartido Free/Trigger para Pan/Low Pass/High Pass, Stereo Chorus, Stereo Delay, Stereo Reverb con siete tipos seleccionables (Classic, Room, Chamber, Hall, Cathedral, Plate, Spring) y Limiter. Chorus sigue siendo un send paralelo. Delay y Reverb forman ahora una cadena serial ordenable: el dry permanece a nivel completo, el primer efecto sigue siendo audible y también alimenta al segundo. La casilla Delay before Reverb selecciona Delay -> Reverb cuando está activada y Reverb -> Delay cuando está desactivada. Chain Blend 0-100 reduce progresivamente el retorno directo del primer efecto pero lo mantiene a nivel completo en la entrada del segundo; a 100 el primer efecto se escucha solo a través del segundo. Ya no existe un player wet independiente, evitando que el reverb o delay de una frase anterior reaparezcan debajo del habla siguiente. Incluye NVDA Audio Device Lock opcional, colas Delay/Reverb Gate Hold independientes y desactivadas por defecto, 32 presets Factory, presets de usuario, integración API Custom Actions y documentación en inglés, italiano, español y francés. Limitación actual: esta versión está destinada a NVDA de 64 bits y a rutas de audio que utilizan nvwave/WavePlayer."""
